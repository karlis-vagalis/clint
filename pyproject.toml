[project]
name = "clint"
version = "0.1.0"
description = "Find semantic redundancy in agent instruction corpora."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "clint contributors" }]
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "semhash>=0.4.1",
    "typer>=0.27.2",
]

[project.scripts]
clint = "clint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"

[tool.uv]
default-groups = ["dev"]
