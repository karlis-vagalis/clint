[project]
name = "clint"
version = "0.0.0"
description = "Find semantic redundancy in agent instruction corpora."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Karlis Vagalis", email = "karlis.vagalis@gmail.com" }]
dependencies = [
    "markdown-it-py[plugins]>=4.2.0",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "semhash>=0.4.1",
    "typer>=0.27.2",
]

[project.scripts]
clint = "clint.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"
